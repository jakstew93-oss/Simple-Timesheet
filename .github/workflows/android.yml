name: Build Simple Timesheet app and watch APKs

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ST_SIGNING_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/st.keystore"
            echo "ST_KEYSTORE_PATH=$RUNNER_TEMP/st.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ST_SIGNING_KEYSTORE secret is not set, so these APKs use a throwaway key and won't install over earlier builds. Install the phone and watch APKs from the same run."
          fi
      - name: Build and test
        run: gradle testDebugUnitTest assembleDebug
      - name: Name the APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk simple-timesheet.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk simple-timesheet-watch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: simple-timesheet-app
          path: android/simple-timesheet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: simple-timesheet-watch
          path: android/simple-timesheet-watch.apk
      # The app checks the latest release for updates. Only signed builds from main are released,
      # so every release installs over the one before.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.ST_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$((GITHUB_RUN_NUMBER + 100))
          gh release create "app-v$VERSION" simple-timesheet.apk simple-timesheet-watch.apk \
            --title "Simple Timesheet app $VERSION" \
            --notes "Phone app: simple-timesheet.apk (updates itself from the app). Watch app: simple-timesheet-watch.apk (install with Wear Installer 2 or Bugjaeger)." \
            --latest
